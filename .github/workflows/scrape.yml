name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Every 15 minutes (7 minutes off the busy :00)
  - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

# Never let two runs race each other on the same state files.
concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Subscribe to this topic in the ntfy app (or at https://ntfy.sh/<topic>).
  # Anyone who knows the topic name can read it; set a repository variable
  # NTFY_TOPIC to override it with a private one.
  NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'tribunal-tracker-a0df08566299' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
    # The runner's disk is slow the first time a file is read, which can make
    # Chrome take ~10s to start. Read Chrome (and the libraries it loads) in
    # the background now so that happens while checkout and pip install run.
    - name: Warm up Chrome
      run: |
        nohup sh -c '
          find /opt/google/chrome -type f -exec cat {} + >/dev/null 2>&1
          timeout 30 google-chrome --headless --disable-gpu --dump-dom about:blank >/dev/null 2>&1
        ' >/dev/null 2>&1 &
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    - name: Install Chrome and Xvfb
      run: |
        # Both are normally pre-installed on ubuntu-latest, so only touch apt
        # (a ~10s apt-get update) if one of them is actually missing.
        need_update=1
        apt_install() {
          if [ -n "$need_update" ]; then sudo apt-get update; need_update=; fi
          sudo apt-get install -y "$@"
        }
        command -v xvfb-run >/dev/null 2>&1 || apt_install xvfb
        if ! command -v google-chrome >/dev/null 2>&1; then
          apt_install chromium-browser || apt_install chromium
        fi
        CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
        echo "Resolved CHROME_PATH=$CHROME_PATH"
        "$CHROME_PATH" --version || true
        echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
    - name: Run the scraper
      run: |
        ./scrape.sh
    # Still commit whatever did succeed if one page failed, so the change
    # isn't notified again next run.
    - name: Commit and push
      id: commit
      if: ${{ !cancelled() }}
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        # Only a change to a tracked matter's filings matters to accc-mergers;
        # a new entry on the Current matters list isn't in its overlay yet.
        if git diff --name-only HEAD~1 HEAD -- 'matters/*/documents.json' | grep -q .; then
          echo "documents_changed=true" >> "$GITHUB_OUTPUT"
        fi
        git pull --rebase
        git push
    # Kick off accc-mergers' own tribunal scrape, which fills in
    # tribunal_appeals.json and rebuilds the site, rather than waiting for its
    # hourly weekday schedule. Needs ACCC_MERGERS_TOKEN: a fine-grained PAT
    # scoped to nwbort/accc-mergers with "Actions: Read and write". Without
    # it this step is skipped.
    - name: Trigger accc-mergers tribunal scrape
      if: ${{ !cancelled() && steps.commit.outputs.documents_changed == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.ACCC_MERGERS_TOKEN }}
      run: |-
        if [ -z "$GH_TOKEN" ]; then
          echo "ACCC_MERGERS_TOKEN not set; not triggering accc-mergers"
          exit 0
        fi
        gh workflow run scrape-tribunal.yml --repo nwbort/accc-mergers --ref main
